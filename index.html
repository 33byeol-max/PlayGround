<body>
<main id="app" aria-label="Neon Rivals rhythm game">
<canvas id="game" width="1200" height="750" aria-label="Rhythm game playfield"></canvas>
<div class="topbar"><div class="brand">NEON <span>RIVALS</span> <small style="font:9px 'DM Mono';color:#aaa5c5">// BEAT DUEL</small></div><div class="top-actions"><button class="icon-btn" id="soundBtn" aria-label="Toggle sound">♪ SOUND ON</button><button class="icon-btn" id="pauseBtn">Ⅱ PAUSE</button></div></div>
<div class="hud"><div class="hud-line"><span class="song-label">01 / <b>MIDNIGHT CIRCUIT</b></span><span id="scoreText" class="score">000000&nbsp;&nbsp; · &nbsp;0x</span></div><div class="meter"><div class="meter-fill" id="healthFill"></div></div><div class="meter-labels"><span>◆ YOU</span><span>RIVAL ◆</span></div></div>
<div id="toast"></div>
<div class="touch-controls" aria-label="Touch arrow controls"><button class="touch-key" data-lane="0" aria-label="Left">←</button><button class="touch-key" data-lane="1" aria-label="Down">↓</button><button class="touch-key" data-lane="2" aria-label="Up">↑</button><button class="touch-key" data-lane="3" aria-label="Right">→</button></div>
<div class="footer">ARROW KEYS / WASD TO PLAY &nbsp;·&nbsp; HIT ON THE BEAT</div>
<div class="overlay" id="overlay"><section class="panel" id="panel"></section></div>
</main>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),W=1200,H=750;
const overlay=document.querySelector('#overlay'),panel=document.querySelector('#panel'),scoreText=document.querySelector('#scoreText'),healthFill=document.querySelector('#healthFill'),toast=document.querySelector('#toast');
const lanes=['←','↓','↑','→'],colors=['#fa5c9c','#57d8ff','#b68aff','#ffd45f'],keyMap={ArrowLeft:0,ArrowDown:1,ArrowUp:2,ArrowRight:3,a:0,s:1,w:2,d:3,A:0,S:1,W:2,D:3};
let state='menu',notes=[],time=0,startAt=0,score=0,combo=0,best=0,health=.55,hits=0,misses=0,perfects=0,muted=false,audio=null,master=null,musicNodes=[],lastFrame=0,toastTimer=0,beatPulse=0,shakes=0;
const bpm=112,beat=60/bpm,offset=2.15,finishTime=39.8;
function seeded(n){let x=n|0;return()=>{x=(x*1664525+1013904223)|0;return(x>>>0)/4294967296}}
function makeChart(){let r=seeded(9128),a=[];for(let i=0;i<140;i++){let t=offset+i*beat/2;if(t>37.4)break;let phase=i%16;let p=[.83,.34,.58,.38,.84,.38,.6,.44,.82,.32,.6,.39,.87,.43,.65,.52][phase];if(r()<p)a.push({t,lane:Math.floor(r()*4),hit:false,missed:false})}return a}
function start(){initAudio();window.musicStarted=false;notes=makeChart();time=0;score=0;combo=0;best=0;health=.72;hits=misses=perfects=0;state='playing';startAt=performance.now()+800;time=-.8;overlay.classList.add('hidden');document.querySelector('#pauseBtn').textContent='Ⅱ PAUSE';toast.textContent='GET READY';popToast();}
function initAudio(){if(audio){audio.resume();return}try{audio=new(window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=muted?0:.18;master.connect(audio.destination)}catch(e){}}
function tone(freq,when,dur,type='triangle',vol=.12,endFreq,track=false){if(!audio||muted)return;let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,when);if(endFreq)o.frequency.exponentialRampToValueAtTime(Math.max(20,endFreq),when+dur);g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(vol,when+.012);g.gain.exponentialRampToValueAtTime(.0001,when+dur);o.connect(g);g.connect(master);o.start(when);o.stop(when+dur+.02);if(track)musicNodes.push(o)}
function noise(when,dur,vol,filterFreq,track=false){if(!audio||muted)return;let n=Math.floor(audio.sampleRate*dur),b=audio.createBuffer(1,n,audio.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;let s=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();s.buffer=b;f.type='highpass';f.frequency.value=filterFreq;g.gain.setValueAtTime(vol,when);g.gain.exponentialRampToValueAtTime(.0001,when+dur);s.connect(f);f.connect(g);g.connect(master);s.start(when);if(track)musicNodes.push(s)}
function startMusic(){if(!audio)return;musicNodes=[];let base=audio.currentTime+.09;let total=Math.floor((finishTime-offset)/beat);const melody=[55,65.41,73.42,82.41,73.42,65.41,49,65.41,55,73.42,82.41,98,82.41,73.42,65.41,73.42];for(let i=0;i<total;i++){let t=base+i*beat;let bar=i%4;if(bar===0||bar===2)tone(110,t,.22,'sine',.22,38,true);else{noise(t,.12,.12,1800,true);tone(165,t,.1,'triangle',.07,undefined,true)}tone([55,55,82.41,73.42,49,49,73.42,82.41][i%8],t,.22,'triangle',.085,undefined,true);tone(melody[i%16]*2,t+beat*.48,.18,'square',.025,undefined,true)}for(let i=0;i<total*2;i++){let t=base+i*beat/2;noise(t,.035,.022,7000,true)}}
function stopMusic(){if(!audio)return;for(const node of musicNodes){try{node.stop()}catch(e){}}musicNodes=[]}
function soundHit(lane,quality){if(!audio||muted)return;tone([392,440,523,659][lane],audio.currentTime,.11,'sine',quality==='PERFECT'?.13:.075)}
function popToast(){toast.classList.add('pop');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('pop'),560)}
function showMessage(msg,color){toast.textContent=msg;toast.style.color=color;popToast()}
function onInput(lane){if(state!=='playing')return;let candidate=null,delta=9;for(const n of notes){if(n.hit||n.missed||n.lane!==lane)continue;let d=Math.abs(n.t-time);if(d<delta){candidate=n;delta=d}}if(candidate&&delta<=.24){candidate.hit=true;let q=delta<=.095?'PERFECT':delta<=.17?'GREAT':'OK';let pts=q==='PERFECT'?350:q==='GREAT'?220:100;score+=pts+Math.min(combo,50)*5;combo++;best=Math.max(best,combo);hits++;if(q==='PERFECT')perfects++;health=Math.min(1,health+(q==='PERFECT'?.025:.014));soundHit(lane,q);showMessage(q, q==='PERFECT'?'#ffdf72':q==='GREAT'?'#5be8f4':'#fff');shakes=2}else{combo=0;health=Math.max(0,health-.012);showMessage('…','#b6b0ca')}}
function miss(){combo=0;misses++;health=Math.max(0,health-.04);showMessage('MISS','#ff638b');shakes=7}
function pause(){if(state==='playing'){stopMusic();window.musicStarted=false;state='paused';panel.innerHTML='<div class="eyebrow">take a breath</div><h1>GAME<br><em>PAUSED</em></h1><p>Your rival is waiting. Jump back in when you’re ready.</p><button class="primary" id="resume">RESUME</button><div class="hint">PRESS <span class="keycap">P</span> TO RESUME</div>';overlay.classList.remove('hidden');document.querySelector('#resume').onclick=resume}else if(state==='paused')resume()}
function resume(){if(state!=='paused')return;state='playing';startAt=performance.now()-time*1000;overlay.classList.add('hidden');audio?.resume();window.musicStarted=false}
function finish(){stopMusic();state='result';let accuracy=hits+misses?Math.round(hits/(hits+misses)*100):0;let rank=accuracy>=94?'S':accuracy>=82?'A':accuracy>=65?'B':accuracy>=45?'C':'D';panel.innerHTML=`<div class="eyebrow">${health<=0?'beat dropped':'set complete'} · rank ${rank}</div><h1>${health<=0?'NICE TRY':'YOU\'RE'}<br><em>${health<=0?'KEEP GOING':'ELECTRIC'}</em></h1><div class="result-score">${String(score).padStart(6,'0')} POINTS</div><div class="small-row"><span>ACCURACY <b>${accuracy}%</b></span><span>BEST STREAK <b>${best}</b></span><span>PERFECT <b>${perfects}</b></span></div><button class="primary" id="again">PLAY AGAIN</button><div class="hint">${health<=0?'THE NIGHT IS YOUNG. RUN IT BACK.':'ONE MORE ROUND? YOU KNOW YOU WANT TO.'}</div>`;overlay.classList.remove('hidden');document.querySelector('#again').onclick=start}
function update(now){if(state!=='playing')return;time=(now-startAt)/1000;if(time<0)return;if(time===0||(!window.musicStarted&&time>=0)){window.musicStarted=true;startMusic()}for(const n of notes){if(!n.hit&&!n.missed&&time>n.t+.24){n.missed=true;miss()}}if(health<=0||time>finishTime)finish()}
function resize(){let dpr=Math.min(devicePixelRatio||1,2),r=canvas.getBoundingClientRect();canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0)}
function pathRound(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function drawBackground(now){let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#17152a');grad.addColorStop(.55,'#25203c');grad.addColorStop(1,'#11101e');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
// neon moon and stars
let moon=ctx.createRadialGradient(600,180,4,600,180,145);moon.addColorStop(0,'#ffb3da');moon.addColorStop(.12,'#ff84c588');moon.addColorStop(1,'#ff4d9b00');ctx.fillStyle=moon;ctx.fillRect(410,0,380,360);ctx.beginPath();ctx.arc(600,180,67,0,Math.PI*2);ctx.fillStyle='#ffafcd';ctx.fill();ctx.beginPath();ctx.arc(625,163,66,0,Math.PI*2);ctx.fillStyle='#1b1830';ctx.fill();
let rand=seeded(123);for(let i=0;i<65;i++){let x=rand()*W,y=rand()*340;ctx.globalAlpha=.25+.65*(.5+.5*Math.sin(now/700+i));ctx.fillStyle=i%4?'#eae6ff':'#55e8f4';ctx.fillRect(x,y,rand()*2+1,rand()*2+1)}ctx.globalAlpha=1;
// skyline
for(let i=0;i<18;i++){let x=i*74-12,h=95+((i*73)%170),w=54+(i*17)%30,y=455-h;ctx.fillStyle=i%2?'#17172b':'#1c1a32';ctx.fillRect(x,y,w,h);ctx.fillStyle='#54e8f422';for(let j=0;j<4;j++)for(let k=0;k<Math.floor(h/24);k++){if((i*11+j*7+k*3)%4!==0)ctx.fillRect(x+8+j*11,y+12+k*22,4,8)}ctx.fillStyle='#ff4d9b55';ctx.fillRect(x+12,y-4,w-24,2)}
// floor horizon and perspective grid
ctx.fillStyle='#191529';ctx.fillRect(0,455,W,295);let horizon=455;ctx.strokeStyle='#ff4d9b36';ctx.lineWidth=1;for(let i=0;i<15;i++){let yy=horizon+Math.pow(i/14,1.8)*320;ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W,yy);ctx.stroke()}for(let i=-12;i<=12;i++){ctx.beginPath();ctx.moveTo(600+i*5,horizon);ctx.lineTo(600+i*62,750);ctx.stroke()}ctx.fillStyle='#ff4d9b';ctx.globalAlpha=.12+.08*Math.sin(now/160);ctx.fillRect(0,452,W,2);ctx.globalAlpha=1;
// crowd silhouettes
for(let i=0;i<25;i++){let x=i*52+12,y=455+(i%3)*7;ctx.fillStyle=i%2?'#11101d':'#151326';ctx.beginPath();ctx.arc(x,y-27,12,0,Math.PI*2);ctx.fill();ctx.fillRect(x-14,y-14,28,44);ctx.fillRect(x-20,y+4,10,26);ctx.fillRect(x+10,y+4,10,26)} }
function drawCharacter(x,y,side,now){let bob=Math.sin(now/115+(side?1:0))*5,accent=side?'#ff4d9b':'#54e8f4',dark=side?'#222034':'#222b40';ctx.save();ctx.translate(x,y+bob);ctx.shadowColor=accent;ctx.shadowBlur=15;ctx.fillStyle=dark;
// legs
ctx.fillRect(-28,0,22,55);ctx.fillRect(8,0,22,55);ctx.fillStyle=side?'#ff4d9b':'#54e8f4';ctx.fillRect(-30,47,26,8);ctx.fillRect(6,47,27,8);
// torso
ctx.fillStyle=dark;ctx.beginPath();ctx.roundRect(-37,-67,74,78,15);ctx.fill();ctx.fillStyle=accent;ctx.fillRect(-38,-51,76,5);
// head
ctx.fillStyle=side?'#f3c1b4':'#f1d0bc';ctx.beginPath();ctx.arc(0,-91,30,0,Math.PI*2);ctx.fill();ctx.fillStyle=side?'#242039':'#21223a';ctx.beginPath();ctx.arc(0,-99,32,Math.PI,Math.PI*2);ctx.lineTo(31,-84);ctx.lineTo(17,-93);ctx.lineTo(7,-78);ctx.lineTo(-2,-95);ctx.lineTo(-21,-79);ctx.lineTo(-28,-87);ctx.closePath();ctx.fill();
// shades/eyes
ctx.fillStyle=accent;ctx.fillRect(-19,-94,14,9);ctx.fillRect(5,-94,14,9);ctx.fillStyle='#252039';ctx.fillRect(-6,-92,12,4);ctx.fillStyle='#4b2537';ctx.fillRect(-4,-76,10,3);
// arm + mic
ctx.fillStyle=dark;ctx.save();ctx.translate(side?-33:34,-39);ctx.rotate(side?.6:-.65);ctx.fillRect(-6,-3,14,48);ctx.fillStyle='#adb0c5';ctx.fillRect(-3,34,8,17);ctx.fillStyle='#ffdb83';ctx.fillRect(-6,47,14,9);ctx.restore();ctx.restore()}
function arrow(x,y,size,lane,alpha=1,glow=false){ctx.save();ctx.translate(x,y);ctx.globalAlpha=alpha;if(glow){ctx.shadowColor=colors[lane];ctx.shadowBlur=22}ctx.fillStyle=colors[lane];ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.lineJoin='round';ctx.beginPath();if(lane===0){ctx.moveTo(-size*.48,0);ctx.lineTo(-size*.02,-size*.44);ctx.lineTo(-size*.02,-size*.2);ctx.lineTo(size*.48,-size*.2);ctx.lineTo(size*.48,size*.2);ctx.lineTo(-size*.02,size*.2);ctx.lineTo(-size*.02,size*.44)}if(lane===1){ctx.moveTo(0,size*.48);ctx.lineTo(-size*.44,size*.02);ctx.lineTo(-size*.2,size*.02);ctx.lineTo(-size*.2,-size*.48);ctx.lineTo(size*.2,-size*.48);ctx.lineTo(size*.2,size*.02);ctx.lineTo(size*.44,size*.02)}if(lane===2){ctx.moveTo(0,-size*.48);ctx.lineTo(size*.44,-size*.02);ctx.lineTo(size*.2,-size*.02);ctx.lineTo(size*.2,size*.48);ctx.lineTo(-size*.2,size*.48);ctx.lineTo(-size*.2,-size*.02);ctx.lineTo(-size*.44,-size*.02)}if(lane===3){ctx.moveTo(size*.48,0);ctx.lineTo(size*.02,-size*.44);ctx.lineTo(size*.02,-size*.2);ctx.lineTo(-size*.48,-size*.2);ctx.lineTo(-size*.48,size*.2);ctx.lineTo(size*.02,size*.2);ctx.lineTo(size*.02,size*.44)}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
function draw(now){ctx.save();if(shakes>0){ctx.translate((Math.random()-.5)*shakes,(Math.random()-.5)*shakes);shakes*=.82;if(shakes<.4)shakes=0}drawBackground(now);drawCharacter(250,480,0,now);drawCharacter(950,480,1,now);
// playfield backplate
let pulse=state==='playing'?Math.max(0,1-Math.abs((time/beat)%1-.5)*2):0;ctx.fillStyle='#0c0c19a8';pathRound(353,158,494,476,24);ctx.fill();ctx.strokeStyle='#ffffff1a';ctx.lineWidth=1;ctx.stroke();
// lane separators and target pads
let left=383,laneW=108,receptor=270;for(let l=0;l<4;l++){let x=left+l*laneW+laneW/2;ctx.fillStyle=l%2?'#ffffff05':'#ffffff09';ctx.fillRect(left+l*laneW,175,laneW,440);ctx.strokeStyle='#ffffff0b';ctx.beginPath();ctx.moveTo(left+l*laneW,185);ctx.lineTo(left+l*laneW,615);ctx.stroke();ctx.fillStyle='#10101b';ctx.beginPath();ctx.arc(x,receptor,34,0,Math.PI*2);ctx.fill();ctx.strokeStyle=colors[l]+'77';ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=.23+.1*pulse;arrow(x,receptor,36,l,.4,false);ctx.globalAlpha=1;}
// notes
if(state==='playing'||state==='paused'){for(const n of notes){if(n.hit||n.missed)continue;let y=receptor+(n.t-time)*310;if(y<145||y>675)continue;let x=left+n.lane*laneW+laneW/2;arrow(x,y,37,n.lane,Math.min(1,Math.max(.15,1-Math.max(0,y-550)/180)),true)}}
// duel divider / score sparks
ctx.fillStyle='#ffffff';ctx.globalAlpha=.35;ctx.font='10px DM Mono';ctx.textAlign='center';ctx.fillText('VS',600,137);ctx.globalAlpha=1;
// small equalizer under rivals
for(let i=0;i<14;i++){let h=7+Math.abs(Math.sin(now/100+i*.8))*24;ctx.fillStyle=i%2?'#ff4d9b':'#54e8f4';ctx.globalAlpha=.45;ctx.fillRect(546+i*16,617-h,8,h)}ctx.globalAlpha=1;
ctx.restore()}
function frame(now){update(now);draw(now);if(state==='playing'){scoreText.innerHTML=`${String(score).padStart(6,'0')}&nbsp;&nbsp; · &nbsp;${combo}x`;healthFill.style.width=(health*100)+'%';healthFill.style.filter=health<.3?'hue-rotate(300deg)':''}requestAnimationFrame(frame)}
function menu(){panel.innerHTML='<div class="eyebrow">a neon-soaked rhythm showdown</div><h1>NEON<br><em>RIVALS</em></h1><p>The city is yours for the taking. Match the arrows, keep your streak alive, and outplay your rival.</p><div class="track-card"><div class="disc"></div><div><strong>MIDNIGHT CIRCUIT</strong><small>ORIGINAL SYNTHWAVE · INSTRUMENTAL</small></div><span class="bpm">112 BPM</span></div><button class="primary" id="start">START THE SHOWDOWN</button><div class="hint"><span class="keycap">←</span><span class="keycap">↓</span><span class="keycap">↑</span><span class="keycap">→</span> &nbsp; OR &nbsp; <span class="keycap">A</span><span class="keycap">S</span><span class="keycap">W</span><span class="keycap">D</span> &nbsp; TO HIT</div>';document.querySelector('#start').onclick=start}
document.addEventListener('keydown',e=>{if(keyMap[e.key]!==undefined){e.preventDefault();onInput(keyMap[e.key])}if(e.key==='Escape'||e.key==='p'||e.key==='P'){e.preventDefault();if(state==='playing'||state==='paused')pause()}if((e.key==='Enter'||e.key===' ')&&(state==='menu'||state==='result')){e.preventDefault();start()}});
document.querySelectorAll('.touch-key').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('pressed');onInput(+b.dataset.lane)});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>b.classList.remove('pressed')))});
document.querySelector('#pauseBtn').onclick=pause;document.querySelector('#soundBtn').onclick=()=>{muted=!muted;document.querySelector('#soundBtn').textContent=muted?'♪ SOUND OFF':'♪ SOUND ON';if(master)master.gain.setTargetAtTime(muted?0:.18,audio.currentTime,.04)};
window.addEventListener('resize',resize);resize();menu();requestAnimationFrame(frame);
})();
</script>
</body>
